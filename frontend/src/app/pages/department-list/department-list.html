<div class="page-container">
  <div class="header-section">
    <h2>{{ isFormVisible() ? (selectedDepartment ? 'Edit Department' : 'Add Department') : 'Departments' }}</h2>

    @if (!isFormVisible()) {
      <button class="add-btn" (click)="openForm()">Add Department</button>
    } @else {
      <button class="cancel-btn" (click)="closeForm()">Cancel</button>
    }
  </div>

  @if (!isFormVisible()) {
    <app-data-table
        [columns]="columns"
        [data]="departments()"
        (edit)="onEdit($event)"
        (delete)="onDelete($event)">
    </app-data-table>
  } @else {
    <div class="form-container" style="background: white; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto;">
      <app-form-input
        [fields]="formFields"
        [initialData]="selectedDepartment"
        [submitLabel]="selectedDepartment ? 'Update' : 'Save'"
        (formSubmit)="onFormSubmit($event)">
      </app-form-input>
    </div>
  }

  @if (itemToDelete()) {
    <app-confirm-dialog
      [title]="'Delete Department'"
      [message]="'Are you sure you want to delete the department \'' + itemToDelete()?.name + '\'?'"
      (confirm)="confirmDelete()"
      (cancel)="cancelDelete()">
    </app-confirm-dialog>
  }
</div>
